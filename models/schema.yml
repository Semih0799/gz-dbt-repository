version: 2

sources:
  - name: raw        # DBT içinde kullanacağın kısa kaynak adı
    schema: gz_raw_data   # BigQuery'deki veri kümesinin adı
    tables:

    # ---------------   SALES TABLE  ---------------
      - name: sales   # Tablo altındaki name kısmı kendi koyacağımız adlar
        identifier: raw_gz_sales
        description: sales of Greenweez
        columns:
          - name: date_date
            description: date of purchase
          - name: orders_id
            description: foreign key to ship
          - name: pdt_id
            description: foreign key to ship
          - name: revenue
            description: the amount paid by the customer
          - name: quantity
            description: quantity purchased
  # ---      tests:
  # ---        - unique:
  # ---            column_name: "(orders_id || '-' || pdt_id)"
  # ---        - dbt_utils.unique_combination_of_columns:
  # ---            combination_of_columns:
  # ---              - orders_id
  # ---              - pdt_id

    # ---------------   PRODUCT TABLE  ---------------
      - name: product
        identifier: raw_gz_product
        description: products of Greenweez
        columns:
          - name: products_id
            description: primary key
            tests:
              - unique
              - not_null
          - name: purchase_price
            description: purchase price of product

    # ---------------   SHIP TABLE  ---------------
      - name: ship
        identifier: raw_gz_ship
        description: shipping data for orders
        columns:
          - name: orders_id
            description: primary key
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: customer shipping fee
          - name: log_cost
            description: cost of preparing parcel
          - name: ship_cost
            description: shipping cost paid by Greenweez
